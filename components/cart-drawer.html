<div id="cart-drawer" class="fixed inset-0 z-50 invisible opacity-0 transition-opacity duration-300">
    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="toggleCartDrawer()"></div>
    <div
        class="absolute top-0 right-0 bottom-0 w-full max-w-md bg-white dark:bg-card-dark shadow-2xl transform transition-transform duration-300 translate-x-full flex flex-col">
        <!-- Header -->
        <div class="p-4 border-b border-gray-100 dark:border-gray-800 flex justify-between items-center">
            <h2 class="font-display text-xl font-medium">Shopping Cart</h2>
            <button onclick="toggleCartDrawer()"
                class="p-2 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-full transition-colors">
                <span class="material-icons">close</span>
            </button>
        </div>

        <!-- Items List -->
        <div class="flex-1 overflow-y-auto p-4" id="cart-drawer-items">
            <!-- Cart Items rendered by JS -->
        </div>

        <!-- Footer with Subtotal & Actions -->
        <div id="cart-drawer-bottom"
            class="p-4 border-t border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-card-dark">
            <div class="flex justify-between items-center">
                <span class="text-lg font-medium">Subtotal</span>
                <span id="cart-drawer-subtotal" class="text-lg font-bold">Rs. 0.00</span>
            </div>
            <p class="text-xs text-gray-500 mb-6">Taxes and shipping calculated at checkout</p>
            <button id="cart-drawer-checkout-btn"
                class="block w-full py-3 bg-primary text-white font-medium hover:opacity-90 transition-opacity rounded uppercase tracking-wide mb-3">Check
                Out</button>
            <a href="cart.html"
                class="block w-full text-center text-sm underline text-black dark:text-white hover:text-gray-600 transition-colors">View
                Cart</a>
        </div>
    </div>
</div>
