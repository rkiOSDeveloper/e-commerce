<!doctype html>
<html lang="en">

<head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <link rel="icon" href="images/clothyfly_favicon.jpg" />

        <title>Shopping Cart - Clothyfly</title>
        <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
        <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&amp;family=Inter:wght@300;400;500;600&amp;display=swap"
                rel="stylesheet" />
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined" rel="stylesheet" />
        <script>
                tailwind.config = {
                        darkMode: "class",
                        theme: {
                                extend: {
                                        colors: {
                                                primary: "#111111",
                                                "background-light": "#ffffff",
                                                "background-dark": "#121212",
                                                "card-light": "#f8f8f8",
                                                "card-dark": "#1e1e1e",
                                                accent: "#ef4444",
                                        },
                                        fontFamily: {
                                                display: ["Oswald", "sans-serif"],
                                                sans: ["Inter", "sans-serif"],
                                        },
                                        borderRadius: {
                                                DEFAULT: "0.5rem",
                                        },
                                },
                        },
                };
        </script>
        <style>
                .hide-scrollbar::-webkit-scrollbar {
                        display: none;
                }

                .hide-scrollbar {
                        -ms-overflow-style: none;
                        scrollbar-width: none;
                }
        </style>
</head>

<body
        class="bg-background-light dark:bg-background-dark text-gray-900 dark:text-gray-100 font-sans transition-colors duration-200 pb-10 lg:pb-0 flex flex-col min-h-screen">
        <!-- Header Component (loaded dynamically) -->
        <div id="header-placeholder"></div>

        <main class="flex-grow pb-20">
                <!-- Cart Content -->
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div class="container mx-auto px-4 pt-16 pb-10 text-center">
                                <h1 class="font-display text-4xl font-medium text-center mb-4">
                                        Shopping Cart
                                </h1>
                                <nav id="breadcrumb-nav"
                                        class="text-xs text-gray-500 dark:text-gray-400 mb-4 uppercase tracking-widest">
                                        <a class="hover:text-black dark:hover:text-white transition-colors"
                                                href="index.html">Home</a>
                                        <span class="mx-2">/</span>
                                        <span class="text-black dark:text-white font-medium">Cart</span>
                                </nav>
                        </div>
                        <div id="cart-empty-message" class="hidden text-center py-16">
                                <p class="text-xl text-gray-500 mb-6">
                                        Your cart is currently empty. <a href="product_list.html"
                                                class="inline-block border-b border-black text-black hover:text-gray-600 transition-colors pb-0.5">Back
                                                to shopping</a>
                                </p>
                        </div>
                        <div id="cart-container" class="hidden">
                                <!-- Cart Items -->
                                <div class="w-full">
                                        <div
                                                class="flex justify-between sm:grid sm:grid-cols-12 text-sm font-bold text-black border-b border-gray-200 pb-2 mb-4">
                                                <div class="sm:col-span-6">Product</div>
                                                <div class="sm:col-span-2 text-right sm:text-left">Price</div>
                                                <div class="hidden sm:block sm:col-span-2">Quantity</div>
                                                <div class="hidden sm:block sm:col-span-2 text-right">Total</div>
                                        </div>

                                        <div id="cart-items-list">
                                                <!-- Items rendered by JS -->
                                        </div>
                                </div>

                                <!-- Order Summary -->
                                <div class="mt-8 flex justify-end">
                                        <div class="w-full max-w-sm pt-6">
                                                <div class="flex justify-between items-center mb-2">
                                                        <span class="text-lg font-bold text-black">Subtotal</span>
                                                        <span id="cart-subtotal"
                                                                class="text-lg font-bold text-black">Rs. 0.00</span>
                                                </div>

                                                <p class="text-xs text-gray-500 mb-6">
                                                        Taxes and shipping calculated at checkout
                                                </p>

                                                <button id="cart-page-checkout-btn"
                                                        class="w-full bg-black text-white py-4 font-bold uppercase tracking-wider hover:bg-opacity-90 transition-colors text-sm rounded">
                                                        Check Out
                                                </button>
                                        </div>
                                </div>
                        </div>
                </div>
        </main>

        <!-- Footer Component (loaded dynamically) -->
        <div id="footer-placeholder"></div>

        <button id="scroll-to-top"
                class="fixed bottom-20 lg:bottom-6 right-6 bg-white text-black p-3 rounded-full shadow-xl hover:bg-gray-100 transition-all duration-300 z-50 opacity-0 invisible translate-y-4">
                <span class="material-icons text-xl">arrow_upward</span>
        </button>

        <!-- Mobile Menu Drawer (White Background) -->
        <!-- Mobile Menu Component (loaded dynamically) -->
        <div id="mobile-menu-placeholder"></div>

        <!-- Cart Drawer Component (loaded dynamically) -->
        <div id="cart-drawer-placeholder"></div>

        <!-- Auth Popup Component (loaded dynamically) -->
        <div id="auth-popup-placeholder"></div>

        <!-- Search Modal -->
        <div id="search-modal"
                class="fixed inset-0 z-[60] bg-white dark:bg-background-dark transform translate-y-full transition-transform duration-300 flex flex-col">
                <div class="p-4 border-b border-gray-100 dark:border-gray-800 flex justify-between items-center">
                        <h2 class="text-lg font-medium text-gray-900 dark:text-white">
                                Search our store
                        </h2>
                        <button onclick="toggleSearchModal()"
                                class="text-gray-500 hover:text-black dark:text-gray-400 dark:hover:text-white focus:outline-none">
                                <span class="material-icons text-2xl">close</span>
                        </button>
                </div>
                <div class="p-4">
                        <div class="relative mb-6">
                                <input id="mobile-search-input" type="text" placeholder="Search products"
                                        class="w-full border border-gray-300 dark:border-gray-700 rounded-lg py-3 px-4 pl-4 pr-10 text-gray-900 dark:text-white bg-transparent focus:ring-1 focus:ring-black dark:focus:ring-white focus:border-transparent outline-none" />
                                <button class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400">
                                        <span class="material-icons text-xl">search</span>
                                </button>
                        </div>
                </div>
        </div>

        <!-- Sticky Bottom Navigation (Mobile/Tablet) -->
        <div style="padding-bottom: calc(20px + env(safe-area-inset-bottom))"
                class="fixed bottom-0 left-0 right-0 bg-white dark:bg-black border-t border-gray-200 dark:border-gray-800 flex justify-between px-8 pt-3 z-30 lg:hidden">
                <a href="index.html"
                        class="flex flex-col items-center justify-center text-gray-400 dark:text-gray-500 hover:text-black dark:hover:text-white transition-colors">
                        <span class="material-icons text-2xl">home</span>
                </a>
                <a href="product_list.html"
                        class="flex flex-col items-center justify-center text-gray-400 dark:text-gray-500 hover:text-black dark:hover:text-white transition-colors">
                        <span class="material-icons text-2xl">grid_view</span>
                </a>

                <a href="cart.html"
                        class="flex flex-col items-center justify-center text-black dark:text-white relative">
                        <span class="material-icons text-2xl">shopping_bag</span>
                        <span
                                class="cart-count-badge absolute -top-1 -right-1 flex h-4 w-4 items-center justify-center rounded-full bg-red-600 dark:bg-white text-[10px] font-bold text-white dark:text-black hidden">0</span>
                </a>
                <button onclick="toggleSearchModal()"
                        class="flex flex-col items-center justify-center text-gray-400 dark:text-gray-500 hover:text-black dark:hover:text-white transition-colors">
                        <span class="material-icons text-2xl">search</span>
                </button>
        </div>

        <!-- Services -->
        <script src="js/services/api.service.js"></script>
        <script src="js/services/auth.service.js"></script>
        <script src="js/services/product.service.js"></script>
        <script src="js/services/wishlist.service.js"></script>
        <script src="js/services/cart.service.js"></script>

        <!-- Component Loader -->
        <script src="js/utils/component-loader.js"></script>
        <!-- Header Manager -->
        <script src="js/components/header.js"></script>
        <!-- Footer Manager -->
        <script src="js/components/footer.js"></script>
        <!-- Mobile Menu Manager -->
        <script src="js/components/mobile-menu.js?v=2"></script>
        <!-- Cart Drawer Manager -->
        <script src="js/components/cart-drawer.js"></script>
        <script>
                // Load header, footer, mobile menu, and cart drawer components on page load
                document.addEventListener('DOMContentLoaded', async () => {
                        const loader = new ComponentLoader();

                        // Load all components
                        await loader.loadMultiple([
                                { name: 'header', target: '#header-placeholder', method: 'replace' },
                                { name: 'footer', target: '#footer-placeholder', method: 'replace' },
                                { name: 'mobile-menu', target: '#mobile-menu-placeholder', method: 'replace' },
                                { name: 'cart-drawer', target: '#cart-drawer-placeholder', method: 'replace' },
                                { name: 'auth-popup', target: '#auth-popup-placeholder', method: 'replace' }
                        ]);

                        // Initialize auth popup functionality
                        window.authPopupManager = new AuthPopupManager();
                        window.authPopupManager.init();

                        // Refresh login state UI now that components are loaded
                        if (typeof window.checkLoginState === 'function') {
                                window.checkLoginState();
                        }

                        // Initialize header functionality after component is loaded
                        const headerManager = new HeaderManager();
                        await headerManager.init();

                        // Initialize footer functionality after component is loaded
                        const footerManager = new FooterManager();
                        footerManager.init();

                        // Initialize mobile menu functionality after component is loaded
                        const mobileMenuManager = new MobileMenuManager();
                        await mobileMenuManager.init();

                        // Initialize cart drawer functionality after component is loaded
                        window.cartDrawerManager = new CartDrawerManager();
                        window.cartDrawerManager.init();
                });
        </script>

        <!-- Auth Popup Manager -->
        <script src="js/components/auth-popup.js"></script>
        <script src="js/common.js"></script>
        <script src="js/cart.js"></script>
</body>

</html>
