<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link rel="icon" href="images/clothyfly_favicon.jpg" />

    <title>Checkout - Clothyfly</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#111111",
                        "background-light": "#ffffff",
                        "background-dark": "#121212",
                        "card-light": "#f8f8f8",
                        "card-dark": "#1e1e1e",
                        accent: "#ef4444",
                    },
                    fontFamily: {
                        display: ["Oswald", "sans-serif"],
                        sans: ["Inter", "sans-serif"],
                    },
                },
            },
        };
    </script>
</head>

<body
    class="bg-background-light dark:bg-background-dark text-gray-900 dark:text-gray-100 font-sans transition-colors duration-200 pb-10 lg:pb-0 flex flex-col min-h-screen">

    <!-- Header Component (loaded dynamically) -->
    <div id="header-placeholder"></div>

    <!-- Main Content -->
    <main class="flex-grow bg-gray-50 dark:bg-background-dark pt-6 pb-20 lg:pb-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

            <!-- Page Title (Mobile) -->
            <div class="mb-6 lg:hidden">
                <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Checkout</h1>
            </div>

            <!-- Main Grid: 2 Columns on Desktop, Single Column on Mobile -->
            <div class="grid lg:grid-cols-12 gap-6 lg:gap-8">

                <!-- Left Column: Address & Payment (Mobile: Full Width, Desktop: 8 cols) -->
                <div class="lg:col-span-8 space-y-6">

                    <!-- Address Section -->
                    <div class="bg-white dark:bg-card-dark rounded-xl shadow-sm p-6">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-lg font-bold text-gray-900 dark:text-white">Shipping Address</h2>
                            <button onclick="openAddAddressPopup()"
                                class="text-blue-600 hover:text-blue-700 font-medium text-sm flex items-center gap-1 hover:bg-blue-50 dark:hover:bg-gray-800 px-3 py-1.5 rounded-md transition-colors">
                                <span class="material-icons text-sm">add</span>
                                Add New
                            </button>
                        </div>

                        <!-- Address List (dynamically populated) -->
                        <div id="checkout-address-list" class="space-y-3">
                            <!-- Addresses will be rendered here -->
                        </div>

                        <!-- No Address State -->
                        <div id="no-address-message" class="hidden text-center py-8 text-gray-500">
                            <span class="material-icons text-4xl mb-2 text-gray-400">location_off</span>
                            <p class="text-sm">No addresses found. Please add a delivery address.</p>
                        </div>
                    </div>

                    <!-- Payment Method Section -->
                    <div class="bg-white dark:bg-card-dark rounded-xl shadow-sm p-6">
                        <h2 class="text-lg font-bold text-gray-900 dark:text-white mb-6">Payment Method</h2>

                        <div class="space-y-3">
                            <!-- Cash on Delivery -->
                            <label
                                class="flex items-start gap-3 p-4 border-2 border-gray-200 dark:border-gray-700 rounded-lg cursor-pointer hover:border-black dark:hover:border-gray-500 transition-colors has-[:checked]:border-black dark:has-[:checked]:border-white has-[:checked]:bg-gray-50 dark:has-[:checked]:bg-gray-800">
                                <input type="radio" name="payment-method" value="cod" checked
                                    class="mt-1 text-black focus:ring-black dark:bg-gray-700 dark:border-gray-600">
                                <div class="flex-1">
                                    <div class="flex items-center gap-2 mb-1">
                                        <span
                                            class="material-icons text-gray-600 dark:text-gray-400">local_shipping</span>
                                        <span class="font-medium text-gray-900 dark:text-white">Cash on Delivery</span>
                                    </div>
                                    <p class="text-sm text-gray-500 dark:text-gray-400">Pay when you receive your order
                                    </p>
                                </div>
                            </label>

                            <!-- Online Payment (Mock) -->
                            <label
                                class="flex items-start gap-3 p-4 border-2 border-gray-200 dark:border-gray-700 rounded-lg cursor-pointer hover:border-black dark:hover:border-gray-500 transition-colors has-[:checked]:border-black dark:has-[:checked]:border-white has-[:checked]:bg-gray-50 dark:has-[:checked]:bg-gray-800">
                                <input type="radio" name="payment-method" value="online"
                                    class="mt-1 text-black focus:ring-black dark:bg-gray-700 dark:border-gray-600">
                                <div class="flex-1">
                                    <div class="flex items-center gap-2 mb-1">
                                        <span class="material-icons text-gray-600 dark:text-gray-400">payment</span>
                                        <span class="font-medium text-gray-900 dark:text-white">Online Payment</span>
                                    </div>
                                    <p class="text-sm text-gray-500 dark:text-gray-400">UPI, Cards, Net Banking (Demo)
                                    </p>
                                </div>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Order Summary (Mobile: Full Width, Desktop: 4 cols, Sticky on Desktop) -->
                <div class="lg:col-span-4">
                    <div class="bg-white dark:bg-card-dark rounded-xl shadow-sm p-6 lg:sticky lg:top-6">
                        <h2 class="text-lg font-bold text-gray-900 dark:text-white mb-6">Order Summary</h2>

                        <!-- Cart Items -->
                        <div id="checkout-cart-items" class="space-y-4 mb-6 max-h-64 overflow-y-auto">
                            <!-- Cart items will be rendered here -->
                        </div>

                        <!-- Pricing Breakdown -->
                        <div class="border-t border-gray-200 dark:border-gray-700 pt-4 space-y-2 mb-6">
                            <div class="flex justify-between text-sm">
                                <span class="text-gray-600 dark:text-gray-400">Subtotal</span>
                                <span id="checkout-subtotal" class="font-medium text-gray-900 dark:text-white">Rs.
                                    0.00</span>
                            </div>
                            <div class="flex justify-between text-sm">
                                <span class="text-gray-600 dark:text-gray-400">Shipping</span>
                                <span id="checkout-shipping" class="font-medium text-gray-900 dark:text-white">Rs.
                                    0.00</span>
                            </div>
                            <div class="flex justify-between text-sm">
                                <span class="text-gray-600 dark:text-gray-400">Tax</span>
                                <span id="checkout-tax" class="font-medium text-gray-900 dark:text-white">Rs.
                                    0.00</span>
                            </div>
                            <div
                                class="flex justify-between text-base font-bold pt-2 border-t border-gray-200 dark:border-gray-700">
                                <span class="text-gray-900 dark:text-white">Total</span>
                                <span id="checkout-total" class="text-gray-900 dark:text-white">Rs. 0.00</span>
                            </div>
                        </div>

                        <!-- Place Order Button -->
                        <button onclick="placeOrder()"
                            class="w-full bg-black dark:bg-white text-white dark:text-black font-medium py-3 rounded-lg hover:opacity-90 transition-opacity flex items-center justify-center gap-2">
                            <span>Place Order</span>
                            <span class="material-icons text-xl">arrow_forward</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Component (loaded dynamically) -->
    <div id="footer-placeholder"></div>

    <!-- Mobile Menu Component (loaded dynamically) -->
    <div id="mobile-menu-placeholder"></div>

    <!-- Cart Drawer Component (loaded dynamically) -->
    <div id="cart-drawer-placeholder"></div>

    <!-- Auth Popup Component (loaded dynamically) -->
    <div id="auth-popup-placeholder"></div>

    <!-- Add Address Popup (Reused from profile.html) -->
    <div id="add-address-popup" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="closeAddAddressPopup()"></div>
        <div
            class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-full max-w-2xl bg-white dark:bg-card-dark p-6 rounded-lg shadow-2xl max-h-[90vh] overflow-y-auto mx-4">
            <div class="flex justify-between items-center mb-6">
                <h2 id="add-address-popup-title" class="text-xl font-bold text-gray-900 dark:text-white">Add address
                </h2>
                <button onclick="closeAddAddressPopup()" class="text-gray-500 hover:text-black dark:hover:text-white">
                    <span class="material-icons">close</span>
                </button>
            </div>

            <input type="hidden" id="add-address-id">

            <div class="mb-4">
                <label class="flex items-center space-x-2 cursor-pointer">
                    <input type="checkbox" id="add-address-default"
                        class="rounded border-gray-300 text-black focus:ring-black dark:bg-gray-800 dark:border-gray-700">
                    <span class="text-sm text-gray-700 dark:text-gray-300">This is my default address</span>
                </label>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">First name</label>
                    <input type="text" id="add-address-firstname"
                        class="w-full text-sm border-gray-300 rounded focus:ring-black focus:border-black dark:bg-gray-800 dark:border-gray-700 dark:text-white">
                </div>
                <div>
                    <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">Last name</label>
                    <input type="text" id="add-address-lastname"
                        class="w-full text-sm border-gray-300 rounded focus:ring-black focus:border-black dark:bg-gray-800 dark:border-gray-700 dark:text-white">
                </div>
            </div>

            <div class="mb-4">
                <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">Address</label>
                <input type="text" id="add-address-line1"
                    class="w-full text-sm border-gray-300 rounded focus:ring-black focus:border-black dark:bg-gray-800 dark:border-gray-700 dark:text-white">
            </div>

            <div class="mb-4">
                <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">Apartment, suite, etc
                    (optional)</label>
                <input type="text" id="add-address-line2"
                    class="w-full text-sm border-gray-300 rounded focus:ring-black focus:border-black dark:bg-gray-800 dark:border-gray-700 dark:text-white">
            </div>

            <div class="grid grid-cols-3 gap-4 mb-4">
                <div>
                    <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">City</label>
                    <input type="text" id="add-address-city"
                        class="w-full text-sm border-gray-300 rounded focus:ring-black focus:border-black dark:bg-gray-800 dark:border-gray-700 dark:text-white">
                </div>
                <div>
                    <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">State</label>
                    <select id="add-address-state"
                        class="w-full text-sm border-gray-300 rounded focus:ring-black focus:border-black dark:bg-gray-800 dark:border-gray-700 dark:text-white">
                        <option value="">Select State</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">PIN code</label>
                    <input type="text" id="add-address-pincode"
                        class="w-full text-sm border-gray-300 rounded focus:ring-black focus:border-black dark:bg-gray-800 dark:border-gray-700 dark:text-white">
                </div>
            </div>

            <div class="mb-6">
                <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">Phone</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                        <img src="https://flagcdn.com/w20/in.png" class="w-5 h-auto">
                        <span class="text-gray-500 text-sm ml-2">+91</span>
                        <div class="h-5 w-px bg-gray-300 ml-3"></div>
                    </div>
                    <input type="tel" id="add-address-phone"
                        class="w-full text-sm border-gray-300 rounded pl-24 focus:ring-black focus:border-black dark:bg-gray-800 dark:border-gray-700 dark:text-white"
                        placeholder="Mobile number">
                </div>
            </div>

            <div class="flex justify-end gap-3">
                <button onclick="closeAddAddressPopup()"
                    class="px-4 py-2 text-sm font-medium text-gray-600 border border-gray-200 rounded hover:bg-gray-50 dark:border-gray-700 dark:hover:bg-gray-800 dark:text-gray-300 transition-colors">Cancel</button>
                <button onclick="saveCheckoutAddress()"
                    class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded hover:bg-blue-700 transition-colors">Save</button>
            </div>
        </div>
    </div>

    <!-- Sticky Bottom Navigation (Mobile/Tablet) -->
    <div style="padding-bottom: calc(20px + env(safe-area-inset-bottom))"
        class="fixed bottom-0 left-0 right-0 bg-white dark:bg-black border-t border-gray-200 dark:border-gray-800 flex justify-between px-8 pt-3 z-30 lg:hidden">
        <a href="index.html"
            class="flex flex-col items-center justify-center text-gray-400 dark:text-gray-500 hover:text-black dark:hover:text-white transition-colors">
            <span class="material-icons text-2xl">home</span>
        </a>
        <a href="product_list.html"
            class="flex flex-col items-center justify-center text-gray-400 dark:text-gray-500 hover:text-black dark:hover:text-white transition-colors">
            <span class="material-icons text-2xl">grid_view</span>
        </a>
        <a href="cart.html"
            class="flex flex-col items-center justify-center text-gray-400 dark:text-gray-500 hover:text-black dark:hover:text-white transition-colors relative">
            <span class="material-icons text-2xl">shopping_bag</span>
            <span
                class="cart-count-badge absolute -top-1 -right-1 flex h-4 w-4 items-center justify-center rounded-full bg-red-600 dark:bg-white text-[10px] font-bold text-white dark:text-black hidden">0</span>
        </a>
        <button onclick="toggleSearchModal()"
            class="flex flex-col items-center justify-center text-gray-400 dark:text-gray-500 hover:text-black dark:hover:text-white transition-colors">
            <span class="material-icons text-2xl">search</span>
        </button>
    </div>

    <!-- Services -->
    <script src="js/services/api.service.js"></script>
    <script src="js/services/auth.service.js"></script>
    <script src="js/services/product.service.js"></script>
    <script src="js/services/wishlist.service.js"></script>
    <script src="js/services/cart.service.js"></script>
    <script src="js/services/order.service.js"></script>

    <!-- Common Functionality -->
    <script src="js/common.js"></script>
    <script src="js/utils/toast-manager.js"></script>

    <!-- Component Loader -->
    <script src="js/utils/component-loader.js"></script>

    <!-- Components -->
    <script src="js/components/header.js"></script>
    <script src="js/components/footer.js"></script>
    <script src="js/components/mobile-menu.js?v=2"></script>
    <script src="js/components/cart-drawer.js"></script>
    <script src="js/components/auth-popup.js"></script>

    <!-- Checkout Page Logic -->
    <script src="js/checkout.js"></script>

    <script>
        // Load components on page load
        document.addEventListener('DOMContentLoaded', async () => {
            const loader = new ComponentLoader();

            // Load all components
            await loader.loadMultiple([
                { name: 'header', target: '#header-placeholder', method: 'replace' },
                { name: 'footer', target: '#footer-placeholder', method: 'replace' },
                { name: 'mobile-menu', target: '#mobile-menu-placeholder', method: 'replace' },
                { name: 'cart-drawer', target: '#cart-drawer-placeholder', method: 'replace' },
                { name: 'auth-popup', target: '#auth-popup-placeholder', method: 'replace' }
            ]);

            // Initialize components
            const headerManager = new HeaderManager();
            await headerManager.init();

            const footerManager = new FooterManager();
            footerManager.init();

            // Initialize auth popup functionality first
            window.authPopupManager = new AuthPopupManager();
            window.authPopupManager.init();

            // Refresh login state UI now that components are loaded
            if (typeof window.checkLoginState === 'function') {
                window.checkLoginState();
            }

            const mobileMenuManager = new MobileMenuManager();
            mobileMenuManager.init();

            window.cartDrawerManager = new CartDrawerManager();
            // Handle potential async init safely
            if (window.cartDrawerManager.init && window.cartDrawerManager.init.constructor.name === "AsyncFunction") {
                window.cartDrawerManager.init().catch(e => console.error("Cart Drawer init failed", e));
            } else {
                window.cartDrawerManager.init();
            }

            // Initialize checkout (services already loaded)
            if (typeof initCheckout === 'function') {
                initCheckout();
            }
        });
    </script>
</body>

</html>
