<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link rel="icon" href="images/clothyfly_favicon.jpg" />

    <title>Order Confirmed - Clothyfly</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#111111",
                        "background-light": "#ffffff",
                        "background-dark": "#121212",
                        "card-light": "#f8f8f8",
                        "card-dark": "#1e1e1e",
                        accent: "#ef4444",
                    },
                    fontFamily: {
                        display: ["Oswald", "sans-serif"],
                        sans: ["Inter", "sans-serif"],
                    },
                },
            },
        };
    </script>
</head>

<body
    class="bg-background-light dark:bg-background-dark text-gray-900 dark:text-gray-100 font-sans transition-colors duration-200 flex flex-col min-h-screen">

    <!-- Header Component (loaded dynamically) -->
    <div id="header-placeholder"></div>

    <!-- Main Content -->
    <main class="flex-grow bg-gray-50 dark:bg-background-dark pt-10 pb-20">
        <div class="max-w-2xl mx-auto px-4 sm:px-6">

            <!-- Success Card -->
            <div class="bg-white dark:bg-card-dark rounded-xl shadow-sm p-8 text-center">

                <!-- Success Icon -->
                <div
                    class="w-16 h-16 bg-green-100 dark:bg-green-900/30 rounded-full flex items-center justify-center mx-auto mb-4">
                    <span class="material-icons text-4xl text-green-600 dark:text-green-400">check_circle</span>
                </div>

                <!-- Success Message -->
                <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">Order Placed Successfully!</h1>
                <p class="text-gray-600 dark:text-gray-400 mb-8">Thank you for your purchase. Your order has been
                    confirmed.</p>

                <!-- Order Details -->
                <div class="bg-gray-50 dark:bg-gray-800 rounded-lg p-6 mb-6 text-left">
                    <div class="space-y-3">
                        <div class="flex justify-between">
                            <span class="text-sm text-gray-500 dark:text-gray-400">Order ID:</span>
                            <span id="order-id" class="text-sm font-medium text-gray-900 dark:text-white">-</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-sm text-gray-500 dark:text-gray-400">Order Date:</span>
                            <span id="order-date" class="text-sm font-medium text-gray-900 dark:text-white">-</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-sm text-gray-500 dark:text-gray-400">Total Amount:</span>
                            <span id="order-total" class="text-sm font-medium text-gray-900 dark:text-white">-</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-sm text-gray-500 dark:text-gray-400">Payment Method:</span>
                            <span id="payment-method" class="text-sm font-medium text-gray-900 dark:text-white">-</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-sm text-gray-500 dark:text-gray-400">Estimated Delivery:</span>
                            <span id="estimated-delivery"
                                class="text-sm font-medium text-gray-900 dark:text-white">-</span>
                        </div>
                    </div>
                </div>

                <!-- Order Items -->
                <div id="order-items-container" class="border-t border-gray-200 dark:border-gray-700 pt-6 mb-6">
                    <h3 class="text-sm font-medium text-gray-900 dark:text-white mb-4 text-left">Items Ordered:</h3>
                    <div id="order-items" class="space-y-3">
                        <!-- Items will be rendered here -->
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex flex-col sm:flex-row gap-3">
                    <a href="orders.html"
                        class="flex-1 px-6 py-3 bg-gray-100 dark:bg-gray-800 text-gray-900 dark:text-white font-medium rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors text-center">
                        View Orders
                    </a>
                    <a href="index.html"
                        class="flex-1 px-6 py-3 bg-black dark:bg-white text-white dark:text-black font-medium rounded-lg hover:opacity-90 transition-opacity text-center">
                        Continue Shopping
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Component (loaded dynamically) -->
    <div id="footer-placeholder"></div>

    <!-- Services -->
    <script src="js/services/api.service.js"></script>
    <script src="js/services/auth.service.js"></script>
    <script src="js/services/order.service.js"></script>

    <!-- Component Loader -->
    <script src="js/utils/component-loader.js"></script>

    <!-- Components -->
    <script src="js/components/header.js"></script>
    <script src="js/components/footer.js"></script>

    <!-- Common Functions -->
    <script src="js/common.js"></script>

    <!-- Order Confirmation Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const loader = new ComponentLoader();

            // Load components
            await loader.loadMultiple([
                { name: 'header', target: '#header-placeholder', method: 'replace' },
                { name: 'footer', target: '#footer-placeholder', method: 'replace' }
            ]);

            // Initialize components
            const headerManager = new HeaderManager();
            await headerManager.init();

            const footerManager = new FooterManager();
            footerManager.init();

            // Load order details
            loadOrderDetails();
        });

        async function loadOrderDetails() {
            // Get order ID from URL
            const urlParams = new URLSearchParams(window.location.search);
            const orderId = urlParams.get('id');

            if (!orderId) {
                console.error('[Order Confirmation] No order ID provided');
                return;
            }

            // Fetch order details
            const order = await orderService.getOrderById(orderId);

            if (!order) {
                console.error('[Order Confirmation] Order not found:', orderId);
                return;
            }

            // Display order details
            document.getElementById('order-id').textContent = order.id;
            document.getElementById('order-date').textContent = new Date(order.orderDate).toLocaleDateString('en-IN', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            document.getElementById('order-total').textContent = `Rs. ${order.total.toLocaleString('en-IN', { minimumFractionDigits: 2 })}`;
            document.getElementById('payment-method').textContent = order.paymentMethod === 'cod' ? 'Cash on Delivery' : 'Online Payment';

            if (order.estimatedDelivery) {
                document.getElementById('estimated-delivery').textContent = new Date(order.estimatedDelivery).toLocaleDateString('en-IN', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
            }

            // Render order items
            const itemsContainer = document.getElementById('order-items');
            if (itemsContainer && order.items) {
                itemsContainer.innerHTML = order.items.map(item => `
          <div class="flex gap-3 items-start">
            <div class="w-16 h-20 bg-gray-100 dark:bg-gray-800 rounded overflow-hidden flex-shrink-0">
              <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover">
            </div>
            <div class="flex-1 text-left">
              <h4 class="text-sm font-medium text-gray-900 dark:text-white">${item.name}</h4>
              <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">
                ${item.size ? 'Size: ' + item.size : ''} ${item.color ? '• ' + item.color : ''}
              </p>
              <div class="flex justify-between items-center mt-1">
                <span class="text-xs text-gray-500">Qty: ${item.quantity}</span>
                <span class="text-sm font-medium text-gray-900 dark:text-white">Rs. ${(item.price * item.quantity).toLocaleString('en-IN', { minimumFractionDigits: 2 })}</span>
              </div>
            </div>
          </div>
        `).join('');
            }

            console.log('[Order Confirmation] Order details loaded');
        }
    </script>
</body>

</html>
