  <script>
    // Load header, footer, mobile menu, and cart drawer components on page load
    document.addEventListener('DOMContentLoaded', async () => {
      const loader = new ComponentLoader();

      // Load all components
      await loader.loadMultiple([
        { name: 'header', target: '#header-placeholder', method: 'replace' },
        { name: 'footer', target: '#footer-placeholder', method: 'replace' },
        { name: 'mobile-menu', target: '#mobile-menu-placeholder', method: 'replace' },
        { name: 'cart-drawer', target: '#cart-drawer-placeholder', method: 'replace' },
        { name: 'auth-popup', target: '#auth-popup-placeholder', method: 'replace' }
      ]);

      // Initialize header functionality after component is loaded
      const headerManager = new HeaderManager();
      await headerManager.init();

      // Initialize footer functionality after component is loaded
      const footerManager = new FooterManager();
      footerManager.init();

      // Initialize auth popup functionality first (Critical)
      window.authPopupManager = new AuthPopupManager();
      window.authPopupManager.init();

      // Refresh login state UI now that components are loaded
      if (typeof window.checkLoginState === 'function') {
        window.checkLoginState();
      }

      // Initialize mobile menu functionality (Async, can fail)
      const mobileMenuManager = new MobileMenuManager();
      try {
        await mobileMenuManager.init();
      } catch (error) {
        console.error("Mobile menu init failed:", error);
      }

      // Initialize cart drawer functionality
      window.cartDrawerManager = new CartDrawerManager();
      // Handle potential async init safely
      if (window.cartDrawerManager.init && window.cartDrawerManager.init.constructor.name === "AsyncFunction") {
        window.cartDrawerManager.init().catch(e => console.error("Cart Drawer init failed", e));
      } else {
        window.cartDrawerManager.init();
      }
    });
  </script>

  <!-- Product Card Renderer Utility -->
  <script src="js/utils/product-card-renderer.js"></script>
  <script>
    // Load New Arrivals and Featured Products
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const response = await fetch('data/products.json');
        const data = await response.json();

        const renderer = new ProductCardRenderer();

        // Render New Arrivals (all products from JSON)
        const newArrivalsGrid = document.getElementById('new-arrivals-grid');
        if (newArrivalsGrid) {
          newArrivalsGrid.innerHTML = renderer.renderWithWishlistState(data.products);
        }

        // Render Featured Products (products with featured flag)
        const featuredProducts = data.products.filter(p => p.featured);
        const featuredGrid = document.getElementById('featured-products-grid');
        if (featuredGrid) {
          featuredGrid.innerHTML = renderer.renderWithWishlistState(featuredProducts);
        }
      } catch (error) {
        console.error('Error loading products:', error);
      }
    });
  </script>
